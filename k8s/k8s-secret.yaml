# ---------------------------------------------------------------------------
# K8s Secret — Databricks OAuth M2M credentials
# ---------------------------------------------------------------------------
# This Secret stores the service principal credentials for authenticating
# with Databricks. NEVER commit real credentials — use placeholders and
# create the Secret via kubectl or External Secrets Operator.
#
# To create securely (recommended):
#   kubectl create secret generic databricks-auth \
#     --from-literal=DATABRICKS_HOST='https://<workspace>.cloud.databricks.com' \
#     --from-literal=DATABRICKS_CLIENT_ID='<service-principal-uuid>' \
#     --from-literal=DATABRICKS_CLIENT_SECRET='<oauth-secret>' \
#     -n databricks-pipeline
#
# Or apply this YAML with base64-encoded values (for dev only):
#   echo -n '<value>' | base64
# ---------------------------------------------------------------------------

apiVersion: v1
kind: Secret
metadata:
  name: databricks-auth
  namespace: databricks-pipeline
  labels:
    app.kubernetes.io/name: ai-platform-trigger
    app.kubernetes.io/component: auth
  annotations:
    # Use External Secrets Operator in production
    # external-secrets.io/secret-store: databricks-vault
type: Opaque
data:
  # Base64-encoded values — replace with your actual credentials
  DATABRICKS_HOST: "aHR0cHM6Ly9teS13b3Jrc3BhY2UuY2xvdWQuZGF0YWJyaWNrcy5jb20="  # https://my-workspace.cloud.databricks.com
  DATABRICKS_CLIENT_ID: "PHNlcnZpY2UtcHJpbmNpcGFsLXV1aWQ+"  # <service-principal-uuid>
  DATABRICKS_CLIENT_SECRET: "PG9hdXRoLXNlY3JldD4="  # <oauth-secret>